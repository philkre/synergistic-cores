[project]
name = "synergistic-cores"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "phyid",
    "psutil>=7.2.2",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[tool.uv.sources]
phyid = { git = "https://github.com/Imperial-MIND-lab/integrated-info-decomp" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncore"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # macOS may flag .venv .pth files hidden, which Python 3.13 skips
